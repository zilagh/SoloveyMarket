<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Спасибо за предложение</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f2;
            padding: 24px;
            color: #172018;
        }

        .box {
            max-width: 620px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 18px 45px rgba(30, 60, 35, .10);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #667064;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            background: #1f8f4d;
            color: white;
            padding: 13px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="box">
    <h1>💡 Спасибо за идею!</h1>
    <p>
        Мы получили ваше предложение услуги. Диспетчер рассмотрит его,
        и если услуга действительно востребована — добавим её в сервис.
    </p>
    <a href="/">Вернуться на главную</a>
</div>
</body>
</html>
